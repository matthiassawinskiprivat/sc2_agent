training:
  training_steps: 500_000
  num_envs: 2
  n_steps: 2048
  batch_size: 512
  learning_rate: 0.0003
  device: auto

env:
  env_class: ZergBuildEnv
  maps_dir: train/maps/ladder/no_trigger
  use_computer: false
  max_steps: 200
  headless: true
  macro_tick_interval: 8
  mining_controller: noop
  build_commands:
    - zergling
  spawn:
    drones: 2
    minerals: 100
  pre_spawn_structures:
    - SPAWNINGPOOL
  manager_script:
    - command_type: TRAIN
      unit_type: ZERGLING
      urgent: true
  rewards:
    success: 30.0
    step_penalty: -0.05
    invalid_build_penalty: -0.5

model:
  algorithm: MaskablePPO
  gamma: 0.99
  ent_coef: 0.01
  n_epochs: 4
  policy_kwargs:
    features_extractor_class: src.agent.models.build_policy.BuildFeaturesExtractor
    features_extractor_kwargs:
      features_dim: 128
      thinking_steps: 3
