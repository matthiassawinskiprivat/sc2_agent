training:
  training_steps: 1_000_000
  num_envs: 2
  n_steps: 2048
  batch_size: 512
  learning_rate: 0.0003
  device: auto

env:
  env_class: ZergBuildEnv
  maps_dir: train/maps/ladder/no_trigger
  use_computer: false
  max_steps: 1500
  headless: true
  macro_tick_interval: 16
  mining_controller: scripted
  build_commands:
    - hatchery
  spawn:
    drones: 8
    minerals: 400
  manager_script:
    - command_type: EXPAND
      unit_type: HATCHERY
      target_pos: [0, 0]
      urgent: true
  rewards:
    success: 80.0
    step_penalty: -0.03
    invalid_build_penalty: -2.0
    distance_multiplier: 0.3

model:
  algorithm: MaskablePPO
  gamma: 0.995
  ent_coef: 0.01
  n_epochs: 4
  policy_kwargs:
    features_extractor_class: src.agent.models.build_policy.BuildFeaturesExtractor
    features_extractor_kwargs:
      features_dim: 128
      thinking_steps: 3
