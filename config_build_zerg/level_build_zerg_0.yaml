# level_build_zerg_0 — Zergling rush: pool, overlords, queen, inject, mass lings.

training:
  training_steps: 400_000
  num_envs: 1
  n_steps: 2048
  batch_size: 512
  learning_rate: 0.0003
  device: auto

env:
  env_class: ZergBuildEnv
  maps_dir: train/maps/ladder/build_agent
  max_steps: 3000
  headless: true
  # Soft in-process resets between episodes; hard SC2 remake every K (like unit-control).
  every_k_episodes: 20
  # Future learned-manager cadence (scripted curriculum uses emit-on-idle instead).
  macro_tick_interval: 8
  mining_controller: speed
  build_map_layers:
    - terrain_pathable
    - terrain_creep
    - terrain_buildable
  build_commands:
    - spawningpool
    - zergling
    - overlord
    - queen
    - inject
  spawn:
    drones: 8
    minerals: 0
    overlords: 2
  manager_script:
    - command_type: MINE
      target_pos: [-1, -1]
      worker_count: 8
    - command_type: BUILD
      unit_type: SPAWNINGPOOL
      target_pos: [-1, -1]
    - command_type: TRAIN
      unit_type: OVERLORD
      count: 1
    - command_type: TRAIN
      unit_type: QUEEN
      count: 1
    - command_type: INJECT
      target_pos: [-1, -1]
    - command_type: TRAIN
      unit_type: ZERGLING
      count: 12
    - command_type: INJECT
      target_pos: [-1, -1]
  rewards:
    success: 100.0
    command_complete: 15.0
    inject_reward: 20.0
    step_penalty: -0.02
    invalid_build_penalty: -1.0
    distance_multiplier: 0.5
    mining_active_bonus: 0.02
    idle_miner_penalty: -0.05

model:
  algorithm: MaskablePPO
  gamma: 0.995
  ent_coef: 0.01
  n_epochs: 4
  policy_kwargs:
    features_extractor_class: src.agent.models.build_policy.BuildFeaturesExtractor
    features_extractor_kwargs:
      features_dim: 128
      thinking_steps: 3
      map_resolution: 16
