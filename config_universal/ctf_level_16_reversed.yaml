training:
  training_steps: 125000
  num_envs: 6
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  render_beacon: false
  watchdog_timeout: 3600
  target_kl: null
  rollout_buffer: disk
env:
  env_class: CaptureTheFlagEnv
  max_steps: 150
  headless: true
  every_k_episodes: 200
  alternate_trainee_race: true
  include_race: true
  maps_dir: train/maps/ladder/with_region
  env_mode: heal,cloak,spellcaster
  unit_pools:
  - high_level_command: attack
    race: zerg
    mineral_budget: 1275
    vespene_budget: 925
    unit_pool:
    - ZERGLING
    - BANELING
    - ROACH
    - RAVAGER
    - HYDRALISK
    - ULTRALISK
    - SWARMHOSTMP
    - CORRUPTOR
    - MUTALISK
    - BROODLORD
    - INFESTOR
    - QUEEN
    - VIPER
    - LURKERMP
    region: A
  - high_level_command: defend
    race: protoss
    mineral_budget: 950
    vespene_budget: 700
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    - HIGHTEMPLAR
    - SHIELDBATTERY
    - DARKTEMPLAR
    region: A
  - high_level_command: defend
    race: zerg
    mineral_budget: 950
    vespene_budget: 700
    unit_pool:
    - ZERGLING
    - BANELING
    - ROACH
    - RAVAGER
    - HYDRALISK
    - ULTRALISK
    - SWARMHOSTMP
    - CORRUPTOR
    - MUTALISK
    - BROODLORD
    - INFESTOR
    - QUEEN
    - VIPER
    - LURKERMP
    region: B
  - high_level_command: attack
    race: protoss
    mineral_budget: 1275
    vespene_budget: 925
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    - HIGHTEMPLAR
    - DARKTEMPLAR
    region: B
  rewards:
    economic_vespene_weight: 1.5
    economic_value_norm: 100.0
    attacker_enemy_value_reward: 3.0
    attacker_own_value_penalty: 2.0
    defender_enemy_value_reward: 2.5
    defender_own_value_penalty: 3.0
    defender_pylon_penalty_scale: 1.5
    defender_retained_value_bonus: 4.0
    heal_value_reward: 4.0
    pylon_value_scale: 1.0
    pylon_own_value_penalty: 1.0
    melee_multiplier: 0.5
    distance_multiplier: 1.0
    defender_zone_radius: 10.0
    attacker_objective_radius: 12.0
    objective_credit_falloff: 15.0
    objective_credit_min_scale: 0.25
    defender_zone_leave_penalty: 0.08
    defender_zone_return_scale: 1.0
    cooldown_retreat_scale: 0.6
    aoe_land_reward: 0.75
    detection_reward: 1.0
    snipe_value_reward: 1.0
    spellcaster_retreat_scale: 0.6
    low_hp_conceal_reward: 1.0
    low_hp_reveal_reward: 0.75
    ambush_burrow_reward: 0.25
    ambush_unburrow_reward: 0.5
    win_reward: 15.0
    loss_penalty: -12.5
    draw_penalty: -10.0
    step_penalty: -0.03
  squad_selection:
    score_threshold: 0.5
    min_selected_units: 1
model:
  algorithm: MaskableRecurrentPPO
  policy: CnnLstmPolicy
  rnn_type: gru
  policy_kwargs:
    features_extractor_class: src.agent.models.squad_network.SquadNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
      use_self_attention: true
      use_relational_decode: true
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.993
  ent_coef: 0.01
  n_epochs: 4
agent_architecture: squad
