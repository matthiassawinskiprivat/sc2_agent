# config_universal/level_move_multi_3.yaml
# Multi-unit movement level for Universal Architecture (16 targets)

training:
  training_steps: 5_000_000
  num_envs: 3
  n_steps: 4096
  batch_size: 4096
  learning_rate: 0.0003
  render_beacon: True
  watchdog_timeout: 3600

# Environment parameters
env:
  env_class: "Level3Env"
  targets: 16
  grid_size: 128
  headless: True
  max_steps: 900
  maps_dir: "train/maps/ladder/no_trigger"
  high_level_command: "scout"
  guidance_curriculum: False
  rewards:
    success: 320.0
    step_penalty: -0.01
    distance_multiplier: 0.1
  action_heads:
    - "move_global"
    - "move_local"


# Model parameters
model:
  algorithm: "MaskableRecurrentPPO"
  policy: "CnnLstmPolicy"
  rnn_type: "gru"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.999
  ent_coef: 0.001
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 1.0
    comparison: "<"
    patience: 5
