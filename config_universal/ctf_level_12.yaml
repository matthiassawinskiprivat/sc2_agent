training:
  training_steps: 1000000
  num_envs: 3
  n_steps: 1024
  batch_size: 32
  learning_rate: 0.0003
  render_beacon: false
  watchdog_timeout: 3600
  target_kl: null
  rollout_buffer: ram
env:
  env_class: CaptureTheFlagEnv
  max_steps: 200
  headless: true
  every_k_episodes: 200
  alternate_trainee_race: true
  maps_dir: train/maps/ladder/with_region
  unit_pools:
  - high_level_command: attack
    race: protoss
    mineral_budget: 350
    vespene_budget: 100
    unit_pool:
    - ZEALOT
    - STALKER
    region: A
  - high_level_command: defend
    race: zerg
    mineral_budget: 175
    vespene_budget: 50
    unit_pool:
    - ZERGLING
    - ROACH
    region: A
  - high_level_command: defend
    race: protoss
    mineral_budget: 350
    vespene_budget: 100
    unit_pool:
    - ZEALOT
    - STALKER
    region: B
  - high_level_command: attack
    race: zerg
    mineral_budget: 175
    vespene_budget: 50
    unit_pool:
    - ZERGLING
    - ROACH
    region: B
  rewards:
    pylon_damage_reward: 1.0
    pylon_damage_penalty: 1.0
    damage_reward: 0.2
    damage_penalty: 0.2
    melee_multiplier: 0.5
    kill_reward: 0.5
    kill_penalty: -0.5
    distance_multiplier: 1.0
    defender_zone_radius: 10.0
    cooldown_retreat_scale: 1.1
    win_reward: 15.0
    loss_penalty: -5.0
    draw_penalty: -2.0
    step_penalty: -0.05
    defender_step_reward: 0.001
  squad_selection:
    score_threshold: 0.5
    min_selected_units: 1
model:
  algorithm: MaskableRecurrentPPO
  policy: CnnLstmPolicy
  rnn_type: gru
  policy_kwargs:
    features_extractor_class: src.agent.models.squad_network.SquadNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
      use_self_attention: true
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.995
  ent_coef: 0.01
  n_epochs: 2
agent_architecture: squad
