# config_universal/level_attack_12.yaml
# Combat: 2 Stalkers vs 6 Marines (3 per slot). Ranged vs ranged, extended training run.

training:
  training_steps: 1_000_000
  num_envs: 8
  n_steps: 2048
  batch_size: 1024
  learning_rate: 0.0002
  render_beacon: False
  watchdog_timeout: 3600
  target_kl: null

# Environment parameters
env:
  env_class: "Level7Env"
  unit_type: "HELLION"
  enemy_type: "ZERGLING"
  targets: 2
  enemies_per_target: 5
  headless: True
  max_steps: 340
  maps_dir: "train/maps/ladder/no_trigger"
  high_level_command: "attack"
  guidance_curriculum: False

  rewards:
    step_penalty: -0.1
    distance_multiplier: 1.0
    retreat_shaping_scale: 1.0
    cooldown_retreat_scale: 0.8
    attack_on_cooldown_penalty: 0.3
    kiting_close_in_penalty: 1.5
    weapon_ready_attack_bonus: 0.3
    sweet_spot_bonus: 0.2
    in_danger_penalty: 1.5
    damage_reward: 1.0
    damage_penalty: -0.5
    kill_reward: 10.0
    kill_penalty: -1.0
    win_reward: 20.0
    loss_penalty: -15.0
    timeout_penalty: -15.0
    use_global: 0.5

# Model parameters
model:
  algorithm: "MaskableRecurrentPPO"
  policy: "CnnLstmPolicy"
  rnn_type: "gru"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.997
  ent_coef: 0.001
  n_epochs: 4

