# config_hybrid/level_move_single.yaml

training:
  training_steps: 500_000
  num_envs: 4
  n_steps: 4096
  batch_size: 1024
  learning_rate: 0.0005
  render_beacon: True
  watchdog_timeout: 3600

# Environment parameters
env:
  headless: True
  max_steps: 100
  maps_dir: "train/maps/32x32"
  high_level_command: "scout"
  guidance_curriculum: False
  rewards:
    success: 20.0
    step_penalty: -0.1
    distance_multiplier: 1.0
  action_heads:
    - "move_global"
    - "move_local"
  active_layers:
    - "allied_unit_density"
    - "enemy_unit_density"
    - "terrain_pathable"
    - "command_objective"
    - "command_assignment"
  active_tactical_layers:
    - "allied_unit_density"
    - "enemy_unit_density"
    - "command_objective"
    - "command_assignment"
    - "terrain_pathable"
# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
  gamma: 0.99 # horizon 100
  ent_coef: 0.001
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 10.0
    comparison: "<"
    patience: 5
