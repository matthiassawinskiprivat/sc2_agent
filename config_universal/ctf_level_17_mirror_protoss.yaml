training:
  training_steps: 500_000
  num_envs: 6
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  render_beacon: false
  watchdog_timeout: 3600
  target_kl: null
  rollout_buffer: disk
env:
  env_class: CaptureTheFlagEnv
  max_steps: 200
  headless: true
  every_k_episodes: 100
  alternate_trainee_race: false
  include_race: true
  maps_dir: train/maps/ladder/with_region
  unit_pools:
  - high_level_command: attack
    agent: true
    race: protoss
    mineral_budget: 2000
    vespene_budget: 2000
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    region: A
  - high_level_command: defend
    race: protoss
    mineral_budget: 1500
    vespene_budget: 1500
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    region: A
  - high_level_command: defend
    agent: true
    race: protoss
    mineral_budget: 1500
    vespene_budget: 1500
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    region: B
  - high_level_command: attack
    race: protoss
    mineral_budget: 2000
    vespene_budget: 2000
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    region: B
  rewards:
    pylon_damage_reward: 1.0
    pylon_damage_penalty: 0.5
    damage_reward: 0.2
    damage_penalty: 0.1
    melee_multiplier: 0.5
    kill_reward: 0.25
    kill_penalty: -0.25
    distance_multiplier: 1.0
    defender_zone_radius: 10.0
    cooldown_retreat_scale: 1.1
    win_reward: 7.5
    loss_penalty: -5.0
    draw_penalty: -3.5
    step_penalty: -0.015
    defender_step_reward: 0.001
  squad_selection:
    score_threshold: 0.5
    min_selected_units: 1
model:
  algorithm: MaskableRecurrentPPO
  policy: CnnLstmPolicy
  rnn_type: gru
  policy_kwargs:
    features_extractor_class: src.agent.models.squad_network.SquadNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
      use_self_attention: true
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.98
  ent_coef: 0.01
  n_epochs: 2
agent_architecture: squad
