training:
  training_steps: 250_000
  num_envs: 6
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  render_beacon: false
  watchdog_timeout: 3600
  target_kl: null
  rollout_buffer: disk
env:
  env_class: CaptureTheFlagEnv
  max_steps: 200
  headless: true
  every_k_episodes: 100
  # Same-race Queen vs Queen: spawn owners use agent flags (not race-alternate).
  # Race-alternate vs Battlecruisers made half the buffer SCV-repair (range 1)
  # and Yamato deleted half-HP Queens before Transfuse could be sampled.
  alternate_trainee_race: false
  include_race: true
  env_mode: heal
  damaged_units: true
  # Click square width in spatial cells (1 cell ≈ 1 game unit). Shrinks by 0.5
  # each following heal level; omit the key for the default 1×1 pointer.
  heal_click_cells: 5
  # One-time graft prior (not CONTINUE_TRAINING). Blend heal_local 50% toward
  # attack_local so Transfuse is sampled without replacing combat. extra=0
  # (full copy + 1.0 nat made heal the default fight action).
  loud_command_heads:
  - heal_local
  loud_command_mix: 0.5
  loud_command_bias: 0.5
  maps_dir: train/maps/ladder/with_region
  unit_pools:
  - high_level_command: attack
    agent: true
    race: zerg
    mineral_budget: 1200
    vespene_budget: 0
    unit_pool:
    - QUEEN
    region: A
  - high_level_command: defend
    race: zerg
    mineral_budget: 900
    vespene_budget: 0
    unit_pool:
    - QUEEN
    region: A
  - high_level_command: defend
    agent: true
    race: zerg
    mineral_budget: 900
    vespene_budget: 0
    unit_pool:
    - QUEEN
    region: B
  - high_level_command: attack
    race: zerg
    mineral_budget: 1200
    vespene_budget: 0
    unit_pool:
    - QUEEN
    region: B
  action_heads:
  - heal_local
  active_layers:
  - allied_hps_field
  - enemy_hps_field
  - terrain_creep
  active_tactical_layers:
  - allied_hps_field
  - enemy_hps_field
  - terrain_creep
  active_unit_scalars:
  - can_heal
  - can_repair
  rewards:
    pylon_damage_reward: 1.0
    pylon_damage_penalty: 0.5
    damage_reward: 0.2
    damage_penalty: 0.1
    # 0.4 let two Queens mutually Transfuse (125 HP free heal, no combat risk)
    # out-earn actually fighting; 0.2 matches every later heal level.
    heal_reward: 0.2
    # heal_cast_reward now only credits a genuinely new cast (see
    # _issue_heal_at_point's continuing_same_patient gate) instead of paying
    # every squad step the healer holds heal_local on a still-wounded ally,
    # so this no longer needs to be large enough to out-earn camping.
    heal_cast_reward: 3.0
    melee_multiplier: 0.5
    kill_reward: 0.25
    kill_penalty: -0.25
    distance_multiplier: 1.0
    defender_zone_radius: 10.0
    cooldown_retreat_scale: 1.1
    win_reward: 7.5
    loss_penalty: -5.0
    draw_penalty: -3.5
    step_penalty: -0.015
    defender_step_reward: 0.001
  squad_selection:
    score_threshold: 0.5
    min_selected_units: 1
model:
  algorithm: MaskableRecurrentPPO
  policy: CnnLstmPolicy
  rnn_type: gru
  policy_kwargs:
    features_extractor_class: src.agent.models.squad_network.SquadNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
      use_self_attention: true
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.99
  ent_coef: 0.01
  n_epochs: 2
agent_architecture: squad
