training:
  training_steps: 1000000
  num_envs: 6
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  render_beacon: false
  watchdog_timeout: 3600
  # Match attack curriculum: joint MultiDiscrete KL (24 pointers + cmd + spatial)
  # trips 0.03 early-stop and starves critic updates. Disable early-stop.
  target_kl: null
  rollout_buffer: disk
env:
  env_class: CaptureTheFlagEnv
  max_steps: 200
  headless: true
  every_k_episodes: 200
  alternate_trainee_race: false
  maps_dir: train/maps/ladder/with_region
  unit_pools:
  - agent: true
    high_level_command: attack
    race: terran
    mineral_budget: 200
    vespene_budget: 150
    unit_pool:
    - REAPER
    region: A
  - high_level_command: defend
    race: zerg
    mineral_budget: 75
    vespene_budget: 0
    unit_pool:
    - ZERGLING
    region: A

  active_layers:
  - allied_unit_biological
  - enemy_unit_biological
  - allied_g_dps_light
  - enemy_g_dps_light
  active_tactical_layers:
  - allied_unit_biological
  - enemy_unit_biological
  - allied_g_dps_light
  - enemy_g_dps_light
  # Squad pointer key features (append-only across CTF curriculum; config order = feature order)
  active_unit_scalars:
  - health_pct
  - shield_pct
  - combined_vitality
  - weapon_cooldown_norm
  - weapon_ready
  - movement_speed_norm
  - dist_to_weapon_ready_norm
  - energy_pct
  - ground_range_norm
  - air_range_norm
  - ground_dps_norm
  - can_attack_air
  - is_melee
  - max_health_norm
  - is_biological
  - is_mechanical
  - is_armored
  - is_massive
  - is_flying
  - has_shield
  - x_norm
  - y_norm
  - dist_to_objective_norm
  - dist_to_enemy_com_norm
  - dist_to_allied_com_norm
  - is_attacking
  - is_moving
  - is_concealed
  - is_detected
  - role_attack
  - role_defend
  rewards:
    pylon_damage_reward: 2.0
    pylon_damage_penalty: 0.9
    damage_reward: 0.4
    damage_penalty: 0.15
    melee_multiplier: 0.5
    kill_reward: 0.5
    kill_penalty: -0.4
    distance_multiplier: 2.0
    defender_zone_radius: 10.0
    cooldown_retreat_scale: 0.9
    win_reward: 15.0
    loss_penalty: -12.5
    draw_penalty: -10.0
    step_penalty: -0.03
    defender_step_reward: 0.001
  squad_selection:
    score_threshold: 0.5
    min_selected_units: 1
model:
  algorithm: MaskableRecurrentPPO
  policy: CnnLstmPolicy
  rnn_type: gru
  policy_kwargs:
    features_extractor_class: src.agent.models.squad_network.SquadNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.994
  ent_coef: 0.015
  n_epochs: 2
agent_architecture: squad
