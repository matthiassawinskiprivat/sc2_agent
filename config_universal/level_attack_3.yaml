# config_universal/level_attack_0.yaml
# Combat level: 1 Roach vs 2 Zerglings on 128x128 maps

training:
  training_steps: 2_000_000
  num_envs: 8
  n_steps: 2048
  batch_size: 1024
  learning_rate: 0.0003
  render_beacon: False
  watchdog_timeout: 3600
  target_kl: null

# Environment parameters
env:
  env_class: "Level7Env"
  unit_type: "ZEALOT"
  enemy_type: "MARAUDER"
  targets: 4
  enemies_per_target: 1
  headless: True
  max_steps: 340
  maps_dir: "train/maps/ladder/no_trigger"
  high_level_command: "attack"
  guidance_curriculum: False

  rewards:
    step_penalty: -0.075
    distance_multiplier: 0.7
    micro_bonus: 0.0
    damage_reward: 0.5
    damage_penalty: -0.1
    kill_reward: 8.0
    kill_penalty: -2.0
    win_reward: 20.0
    loss_penalty: -2.0

# Model parameters
model:
  algorithm: "MaskableRecurrentPPO"
  policy: "CnnLstmPolicy"
  rnn_type: "gru"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.995
  ent_coef: 0.01
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_rew_mean"
    threshold: 15.0
    comparison: ">"
    patience: 10
