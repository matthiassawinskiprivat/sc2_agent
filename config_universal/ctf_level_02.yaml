training:
  training_steps: 250_000
  num_envs: 6
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  render_beacon: false
  watchdog_timeout: 3600
  target_kl: null
  rollout_buffer: disk
env:
  env_class: CaptureTheFlagEnv
  max_steps: 200
  headless: true
  every_k_episodes: 200
  alternate_trainee_race: true
  include_race: true
  maps_dir: train/maps/ladder/with_region
  unit_pools:
  - high_level_command: defend
    race: terran
    mineral_budget: 300
    vespene_budget: 0
    unit_pool:
    - HELLION
    region: B
  - high_level_command: attack
    race: zerg
    mineral_budget: 400
    vespene_budget: 0
    unit_pool:
    - ZERGLING
    region: B
  active_layers:
  - allied_unit_mechanical
  active_tactical_layers:
  - allied_unit_mechanical
  rewards:
    pylon_damage_reward: 2.0
    pylon_damage_penalty: 0.9
    damage_reward: 0.4
    damage_penalty: 0.15
    melee_multiplier: 0.5
    kill_reward: 0.5
    kill_penalty: -0.4
    distance_multiplier: 2.0
    defender_zone_radius: 10.0
    cooldown_retreat_scale: 0.9
    win_reward: 15.0
    loss_penalty: -12.5
    draw_penalty: -10.0
    step_penalty: -0.03
    defender_step_reward: 0.001
    defender_wins_on_timeout: true
  squad_selection:
    score_threshold: 0.5
    min_selected_units: 1
model:
  algorithm: MaskableRecurrentPPO
  policy: CnnLstmPolicy
  rnn_type: gru
  policy_kwargs:
    features_extractor_class: src.agent.models.squad_network.SquadNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.994
  ent_coef: 0.01
  n_epochs: 2
agent_architecture: squad
