training:
  training_steps: 500_000
  num_envs: 5
  n_steps: 2048
  batch_size: 512
  learning_rate: 0.0003
  render_beacon: False
  watchdog_timeout: 3600
  target_kl: null
  rollout_buffer: disk

env:
  env_class: "CaptureTheFlagEnv"
  max_steps: 350
  headless: True
  every_k_episodes: 250

  # Map & layout
  maps_dir: "train/maps/ladder/with_region"
  unit_pools:
    - high_level_command: "attack"
      agent: True
      mineral_budget: 1200   
      vespene_budget: 400
      unit_pool:
        - "ZEALOT"
        - "STALKER"
        - "ADEPT"
        - "IMMORTAL"
        - "ARCHON"
        - "COLOSSUS"
      region: "A"
    - high_level_command: "defend"
      mineral_budget: 850       
      vespene_budget: 400
      unit_pool:
        - "MARINE"
        - "MARAUDER"
        - "HELLIONTANK"
        - "HELLION"
        - "CYCLONE"
        - "THOR"
        - "SIEGETANK"
      region: "A"
    - high_level_command: "defend"
      agent: True
      mineral_budget: 850       
      vespene_budget: 400
      unit_pool:
        - "MARINE"
        - "MARAUDER"
        - "HELLIONTANK"
        - "HELLION"
        - "CYCLONE"
        - "THOR"
        - "SIEGETANK"
      region: "B"
    - high_level_command: "attack"
      mineral_budget: 1200   
      vespene_budget: 400
      unit_pool:
        - "ZEALOT"
        - "STALKER"
        - "ADEPT"
        - "IMMORTAL"
        - "ARCHON"
        - "COLOSSUS"
      region: "B"

  rewards:
    pylon_damage_reward: 1.0 
    pylon_damage_penalty: 1.0
    damage_reward: 0.2
    damage_penalty: 0.2
    kill_reward: 0.5
    kill_penalty: -0.5
    distance_multiplier: 1.0
    defender_zone_radius: 10.0
    cooldown_retreat_scale: 1.1

    # Episode outcome
    win_reward: 15.0
    loss_penalty: -5.0
    draw_penalty: -2.0

    # Per-step role signals
    step_penalty: -0.05          # applied to attacker units each step (discourages passivity)
    defender_step_reward: 0.001  # applied to defender units each step (rewards survival)

model:
  algorithm: "MaskableRecurrentPPO"
  policy: "CnnLstmPolicy"
  rnn_type: "gru"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.996
  ent_coef: 0.001
  n_epochs: 2
