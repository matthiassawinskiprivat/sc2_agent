# config_universal/level_move_multi_0.yaml
# Multi-unit movement level for Universal Architecture (2 targets)

training:
  training_steps: 5_000_000
  num_envs: 4
  n_steps: 4096
  batch_size: 1024
  learning_rate: 0.0003
  render_beacon: True
  watchdog_timeout: 3600

# Environment parameters
env:
  env_class: "Level3Env"
  targets: 2
  headless: True
  max_steps: 180
  maps_dir: "train/maps/64x64"
  high_level_command: "scout"
  guidance_curriculum: False
  rewards:
    success: 40.0
    step_penalty: -0.1
    distance_multiplier: 1.0
# Model parameters
model:
  algorithm: "MaskableRecurrentPPO"
  policy: "CnnLstmPolicy"
  rnn_type: "gru"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.994 # horizon 167
  ent_coef: 0.001
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 1.0
    comparison: "<"
    patience: 5
