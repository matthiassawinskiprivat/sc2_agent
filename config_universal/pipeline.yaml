# config/pipeline.yaml
# Defines the sequence of training levels.

# range:

# SCV / Probe / Drone / Zergling / Broodling: 0.1
# Zealot / Dark Templar: 0.1
# Baneling: 0.25
# Ultralisk: 1.0
# Hellbat: 2.0
# Archon: 3.0
# Adept / Roach: 4.0
# Reaper: 4.5
# Marine / Sentry / Hellion / Widow Mine / Queen: 5.0
# Hydralisk: 5.0 (increases to 6.0 with Grooved Spines upgrade)
# Stalker / Immortal / Ghost / Marauder / Viking (Assault Mode) / Cyclone: 6.0
# Siege Tank (Tank Mode) / Thor (Ground Attack): 7.0
# Colossus: 7.0 (increases to 9.0 with Extended Thermal Lance upgrade)
# Lurker: 9.0 (typical burrowed attack range)
#
# speed:
#
# Hellion 4.25
# Reaper 3.75
# Zergling, Stalker, Ultralisk 2.95
# WBF, Drohne, Sonde 2.81
# Adept, Baneling 2.50
# Marine, Marauder, Ghost, Hellbat, Siege Tank, 
# Cyclone, Zealot, Immortal, Colossus, Disruptor, Dark Templar, 
# Hydralisk, Roach, Infestor, Lurker 2.25
# Thor, High Templer, Archon 1.88
# Queen 0.94


agent_architecture: universal

# Squad levels only (see apply_pipeline_rollout_steps). 1024 steps × 6 games
# of float32 maps is two rollout copies that exceed 32 GB and get paged.
training:
  n_steps: 256
  # Squad levels only (see apply_pipeline_rollout_steps). A PPO batch whose
  # jump exceeds 1.5 * this is dropped before the weight step. 2 keeps the
  # occasional on-policy jump of ~2–3 seen on finished CTF levels. A disconnected
  # notebook is refused separately by the flat replay check.
  target_kl: 2.0

# SC2 process timing (applies to every level via pipeline root ``env``).
# Parallel workers still stagger launches to avoid DirectX access-violation races;
# these are the shortened defaults (override per-level YAML only if needed).
env:
  sc2_startup_stagger_sec: 2.5
  sc2_post_create_delay_sec: 0.75
  sc2_close_settle_sec: 0.5
  sc2_process_tree_wait_sec: 1.0
  sc2_retry_backoff_sec: 2.0
  sc2_in_game_wait_sec: 15.0
  # Squad pointer: game frames simulated after one joint squad order.
  # Independent of army size (about three decisions per game second at 22.4 fps).
  # Per-level YAML can override. Per-unit / chunk turns still use step_mul_per_unit.
  squad_pointer_step_size: 8
  # Opponent samples a new squad order every N trainee decisions and keeps
  # that order in between (last orders are reissued, no extra network pass).
  # 1 = decide every step. Per-level YAML can override.
  opponent_decision_interval: 4
  # Whole-session wait_for around launch+join+first obs. Later Subproc workers
  # add stagger + join-slack on top (see SingleClientEnv._startup_timeout_sec).
  startup_timeout_sec: 90

# Curriculum shape (CTF):
#
#   simple action lesson -> repeated mixed practice -> detailed tactical layers
#   -> harder compositions
#
# Phase 1 introduces every command the squad policy can issue while the
# observation is still just the base attack-curriculum stack (density, terrain,
# objective, assignment, base ground DPS, health, weapon cooldown) plus the one
# or two channels each new action actually needs. The agent therefore spends its
# early budget learning *actions*, not decoding extra map channels.
#
# Order: unit attack → heal → cloak → AoE → heal revisit (Queen vs BC) → snipe.
# Transport (load/unload) is deferred to the end of the pipeline so load does
# not crowd heal out mid phase-1.
#
# Phase 2 adds the detailed tactical channels (biological/mechanical overlays,
# light/armored/massive damage modifiers, air DPS modifiers, splash, upgrades)
# and the harder unit compositions. Because `action_heads` accumulate and are
# never removed, every phase-2 level is also mixed practice for all phase-1
# actions: an action the level's units cannot use is simply masked out of the
# command slice, so it can no longer crowd out attacking (the failure mode that
# made `attack_local` usage collapse when spatial healing was introduced).
#
# Per-unit scalars are declared once at `ctf_level_01` so pointer identity stays
# stable. `is_neuraled` is appended later, at
# `scenario_colossus_zealot_vs_swarmhost_hydra_reversed`. A repeated name is
# skipped, so listing it again does not add a second channel.
levels:
  - "level_move_single_0"
  - "level_move_single_1"
  - "level_move_single_2"
  - "level_move_multi_0"
  - "level_move_multi_1"
  - "level_attack_0"
  - "level_attack_1"
  - "level_attack_2"
  - "level_attack_3"
  - "level_attack_4"
  - "level_attack_5"

  # ================= CTF phase 1: core actions, base layers =================
  # unit-pointer attack (attack_unit) — same 9 global / 11 tactical channels as
  # level_attack_5, so the universal->squad graft needs no channel expansion.
  - "ctf_level_01"
  - "ctf_level_01_zergling_vs_marine"
  - "ctf_level_02_melee_zealot_vs_roach"
  - "ctf_level_02_melee_helliontank_vs_hydralisk"
  # unit-pointer healing (heal_unit) + healing field / creep channels
  - "ctf_heal_queen_vs_queen"
  - "ctf_heal_thor_scv_vs_thor_scv"
  - "ctf_level_18"
  - "ctf_level_19"
  - "ctf_level_20"
  - "scenario_queen_roach_vs_stalker_disruptor"
  # concealment (cloak_burrow / uncloak_unburrow) + cloak channels
  - "ctf_level_21"
  - "ctf_level_22"
  - "ctf_level_23"
  # area-of-effect (aoe_local) + energy channels
  # (No ``*_reversed`` siblings before snipe — mid-curriculum inserts would
  # block CONTINUE_TRAINING on later completed levels after a restart.)
  - "aoe_high_templar_zealot_vs_marine_marauder"
  - "aoe_infestor_roach_vs_marine_marauder"
  - "aoe_zergling_infestor_vs_stalker_templar"
  - "aoe_infestor_ling_vs_infestor_ling"
  - "aoe_zergling_roach_vs_high_templar_immortal"
  # heal duty-cycle revisit (damaged_units) + flying / air-DPS-base channels
  - "scenario_queen_vs_battlecruiser"
  # unit-target specials (snipe): Ghost Steady Targeting / Yamato / Neural / Feedback
  # damaged_units kept on so heal_unit stays open while snipe is learned.
  # From snipe onward, levels where both races need a researched cast ability
  # (or snipe puts Infestor/BC on P2) are split: half steps here, half on the
  # immediate ``*_reversed`` sibling with the other race as SC2 player 1
  # (debug_upgrade only reaches the client / P1).
  - "snipe_ghost_marauder_vs_roach_hydra"
  - "snipe_ghost_marauder_vs_roach_hydra_reversed"
  - "snipe_infestor_roach_vs_battlecruiser_scv"
  - "snipe_infestor_roach_vs_battlecruiser_scv_reversed"
  - "snipe_high_templar_zealot_vs_ghost_medivac"
  - "snipe_battlecruiser_marine_vs_corruptor_hydra"
  - "snipe_battlecruiser_marine_vs_corruptor_hydra_reversed"

  # ========= CTF phase 2: detailed layers and harder compositions ==========
  # biological / light / mechanical overlays
  - "ctf_level_02"
  - "scenario_ravager_roach_vs_siegetank_marine"
  - "scenario_hellion_cyclone_vs_ling_bane"
  # armored
  - "ctf_level_03"
  - "ctf_level_04"
  - "ctf_level_05"
  - "ctf_level_05_reversed"
  - "ctf_level_06"
  - "scenario_adept_disruptor_vs_marine_marauder"
  # massive
  - "ctf_level_07"
  - "ctf_level_08"
  - "ctf_level_08_reversed"
  - "scenario_colossus_zealot_vs_swarmhost_hydra"
  - "scenario_colossus_zealot_vs_swarmhost_hydra_reversed"
  # flying (map channels attached at scenario_queen_vs_battlecruiser)
  - "ctf_level_09"
  # mixed heal vs air
  - "ctf_heal_queen_vs_battlecruiser_scv"
  - "ctf_heal_queen_vs_battlecruiser_scv_reversed"
  - "ctf_level_10"
  - "ctf_level_10_reversed"
  - "ctf_level_11"
  - "scenario_stalker_vs_mutalisk"
  - "scenario_stalker_vs_mutalisk_reversed"
  - "scenario_hydra_vs_tempest"
  - "scenario_hydra_vs_tempest_reversed"
  - "scenario_swarmhost_vs_zealot"
  - "scenario_swarmhost_vs_zealot_reversed"
  # air dps non-base
  - "ctf_level_12"
  - "ctf_level_12_reversed"
  - "ctf_level_13"
  - "ctf_level_13_reversed"
  - "ctf_level_14"
  - "ctf_level_14_reversed"
  - "scenario_marine_vs_mutalisk"
  # splash
  - "ctf_level_15"
  - "ctf_level_15_reversed"
  - "ctf_level_16"
  - "ctf_level_16_reversed"
  - "ctf_level_17"
  - "ctf_level_17_reversed"
  - "ctf_level_17_mirror_terran"
  - "ctf_level_17_mirror_zerg"
  - "ctf_level_17_mirror_protoss"
  - "scenario_ling_bain_vs_marine"
  - "scenario_thor_vs_voidray"
  # upgrades
  - "ctf_level_27"
  - "ctf_level_27_reversed"
  - "ctf_level_28"
  - "ctf_level_28_reversed"
  - "ctf_level_29"
  - "ctf_level_29_reversed"
  - "scenario_lurker_vs_thor"
  - "scenario_dt_vs_marauder"
  - "scenario_widowmine_vs_zergling"
  - "scenario_queen_vs_banshee"
  - "scenario_banshee_viking_vs_voidray_carrier"
  - "scenario_battlecruiser_viking_vs_corruptor_mutalisk"
  - "scenario_battlecruiser_viking_vs_corruptor_mutalisk_reversed"
  - "scenario_tempest_voidray_vs_corruptor_mutalisk"
  - "scenario_tempest_voidray_vs_corruptor_mutalisk_reversed"
  - "scenario_battlecruiser_liberator_vs_corruptor_mutalisk"
  - "scenario_battlecruiser_liberator_vs_corruptor_mutalisk_reversed"
  # mixed-action revisits on the full layer set (spellcasters vs flyers /
  # massive / splash compositions — these need the phase-2 channels)
  - "aoe_ghost_marauder_vs_high_templar_sentry"
  - "aoe_marine_ghost_vs_darktemplar_adept"
  - "aoe_viper_hydra_vs_voidray_phoenix"
  - "aoe_viper_hydra_vs_voidray_phoenix_reversed"
  - "aoe_viper_corruptor_vs_mutalisk"
  - "aoe_ravager_roach_vs_immortal_colossus"
  - "aoe_ravager_roach_vs_immortal_colossus_reversed"
  # transport (load_unit / unload_local) + cargo channels — end of pipeline so
  # load does not crowd heal/snipe during phase 1 / phase 2 practice
  - "ctf_level_24"
  - "ctf_level_25"
  - "ctf_level_25_reversed"
  - "ctf_level_26"
