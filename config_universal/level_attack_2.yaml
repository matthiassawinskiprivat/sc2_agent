# config_universal/level_attack_2.yaml
# Combat: 2 Hellions vs 6 Zerglings (3 per slot). Higher pressure, melee enemy.

training:
  training_steps: 3_000_000
  num_envs: 8
  n_steps: 2048
  batch_size: 1024
  learning_rate: 0.0002
  render_beacon: False
  watchdog_timeout: 3600
  target_kl: null

# Environment parameters
env:
  env_class: "Level7Env"
  unit_type: "HELLION"
  enemy_type: "ZERGLING"
  targets: 2
  enemies_per_target: 3
  headless: True
  max_steps: 340
  maps_dir: "train/maps/ladder/no_trigger"
  high_level_command: "attack"
  guidance_curriculum: False

  rewards:
    step_penalty: -0.075
    distance_multiplier: 0.7
    retreat_shaping_scale: 1.0
    kiting_close_in_penalty: 2.0
    weapon_ready_attack_bonus: 0.3
    sweet_spot_bonus: 0.2
    in_danger_penalty: 2.5
    damage_reward: 1.0
    damage_penalty: -0.5
    kill_reward: 5.0
    kill_penalty: -1.0
    win_reward: 50.0
    loss_penalty: -50.0

# Model parameters
model:
  algorithm: "MaskableRecurrentPPO"
  policy: "CnnLstmPolicy"
  rnn_type: "gru"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.997
  ent_coef: 0.01
  n_epochs: 4

