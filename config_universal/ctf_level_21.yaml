training:
  training_steps: 500_000
  num_envs: 6
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  render_beacon: false
  watchdog_timeout: 3600
  target_kl: null
  rollout_buffer: disk
env:
  env_class: CaptureTheFlagEnv
  max_steps: 200
  headless: true
  every_k_episodes: 100
  alternate_trainee_race: true
  include_race: true
  env_mode: heal,cloak
  heal_click_cells: 2.25
  # One-time graft prior (not CONTINUE_TRAINING). Same recipe as heal_local
  # intro: blend cloak/uncloak 50% toward attack_local so they get sampled
  # without replacing combat.
  loud_command_heads:
  - cloak_burrow
  - uncloak_unburrow
  loud_command_mix: 0.5
  loud_command_bias: 0.5
  maps_dir: train/maps/ladder/with_region
  unit_pools:
  - high_level_command: attack
    race: protoss
    mineral_budget: 2350
    vespene_budget: 2000
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    - DARKTEMPLAR
    - MOTHERSHIP
    region: A
  - high_level_command: defend
    race: terran
    mineral_budget: 1750
    vespene_budget: 1500
    unit_pool:
    - MARINE
    - MARAUDER
    - GHOST
    - HELLION
    - HELLIONTANK
    - CYCLONE
    - SIEGETANK
    - THOR
    - THORAP
    - BANSHEE
    - VIKINGFIGHTER
    - BATTLECRUISER
    - SCV
    - MEDIVAC
    - WIDOWMINE
    region: A
  - high_level_command: defend
    race: protoss
    mineral_budget: 1750
    vespene_budget: 1500
    unit_pool:
    - ZEALOT
    - STALKER
    - ADEPT
    - ARCHON
    - IMMORTAL
    - COLOSSUS
    - DISRUPTOR
    - PHOENIX
    - VOIDRAY
    - TEMPEST
    - CARRIER
    - SHIELDBATTERY
    - DARKTEMPLAR
    - MOTHERSHIP
    region: B
  - high_level_command: attack
    race: terran
    mineral_budget: 2350
    vespene_budget: 2000
    unit_pool:
    - MARINE
    - MARAUDER
    - GHOST
    - HELLION
    - HELLIONTANK
    - CYCLONE
    - SIEGETANK
    - THOR
    - THORAP
    - BANSHEE
    - VIKINGFIGHTER
    - BATTLECRUISER
    - SCV
    - MEDIVAC
    - WIDOWMINE
    region: B
  categorical_heads:
  - cloak_burrow
  - uncloak_unburrow
  active_layers:
  - allied_unit_cloak
  - enemy_unit_cloak
  active_tactical_layers:
  - allied_unit_cloak
  - enemy_unit_cloak
  active_unit_scalars:
  - is_immobile
  - can_cloak
  rewards:
    pylon_damage_reward: 1.0
    pylon_damage_penalty: 0.5
    damage_reward: 0.2
    damage_penalty: 0.1
    heal_reward: 0.4
    melee_multiplier: 0.5
    kill_reward: 0.25
    kill_penalty: -0.25
    distance_multiplier: 1.0
    defender_zone_radius: 10.0
    cooldown_retreat_scale: 1.5
    win_reward: 7.5
    loss_penalty: -5.0
    draw_penalty: -3.5
    step_penalty: -0.015
    defender_step_reward: 0.001
  squad_selection:
    score_threshold: 0.5
    min_selected_units: 1
model:
  algorithm: MaskableRecurrentPPO
  policy: CnnLstmPolicy
  rnn_type: gru
  policy_kwargs:
    features_extractor_class: src.agent.models.squad_network.SquadNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
      use_self_attention: true
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.994
  ent_coef: 0.01
  n_epochs: 2
agent_architecture: squad
