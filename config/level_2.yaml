# config/level_2.yaml
# Configuration for the third level of training (curriculum learning).

training:
  training_steps: 2_000_000
  num_envs: 4
  n_steps: 2048
  batch_size: 512
  learning_rate: 0.0003
  render_beacon: True

# Environment parameters
env:
  grid_size: 128
  headless: True
  max_steps: 500
  maps_dir: "train/maps/level_2"
  rewards:
    success: 100.0
    step_penalty: -0.075
    distance_multiplier: 0.5
  active_layers: []

# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_kwargs:
      features_dim: 512
  gamma: 0.995
  ent_coef: 0.005
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 200.0
    comparison: "<"
    patience: 5
