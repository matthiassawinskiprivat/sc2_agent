# config/level_1.yaml
# Configuration for the second level of training (curriculum learning).

training:
  training_steps: 1_000_000
  num_envs: 4
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  render_beacon: True

# Environment parameters
env:
  grid_size: 64
  headless: True
  max_steps: 500
  maps_dir: "train/maps/level_1"
  rewards:
    success: 20.0
    step_penalty: -0.05
    distance_multiplier: 0.5
  active_layers: []

# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_kwargs:
      features_dim: 512
  gamma: 0.99
  ent_coef: 0.01
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 180.0
    comparison: "<"
    patience: 5
