# config/level_1.yaml
# Configuration for the second level of training (curriculum learning).

training:
  training_steps: 2_500_000
  num_envs: 6
  n_steps: 2048
  batch_size: 1024
  learning_rate: 0.0003
  render_beacon: True
  watchdog_timeout: 3600

# Environment parameters
env:
  grid_size: 64
  headless: True
  max_steps: 500
  maps_dir: "train/maps/level_1"
  guidance_curriculum: False
  rewards:
    success: 50.0
    step_penalty: -0.1
    distance_multiplier: 0.1
  active_layers: []

# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
  gamma: 0.99
  ent_coef: 0.001
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 10.0
    comparison: "<"
    patience: 5
