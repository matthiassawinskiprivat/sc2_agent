# config/level_7.yaml
# Configuration for Level 7: Combat Basics (Move vs Attack)

training:
  training_steps: 200_000
  num_envs: 4
  n_steps: 2048
  batch_size: 512
  learning_rate: 0.0003
  render_beacon: False
  larger_units: True

# Environment parameters
env:
  env_class: "Level7Env"
  unit_type: "MARINE"
  enemy_type: "ZERGLING"
  targets: 1 # Start with 1 pair
  grid_size: 128
  headless: True
  max_steps: 400
  maps_dir: "train/maps/level_3" # Reuse existing maps
  rewards:
    step_penalty: -0.01
    damage_reward: 0.1
    kill_reward: 20.0
    win_reward: 50.0
    loss_penalty: -10.0
  active_layers: [] # Use all layers to preserve vision weights from Level 3

# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_kwargs:
      features_dim: 512
  gamma: 0.995
  ent_coef: 0.01
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_rew_mean"
    threshold: 60.0
    comparison: ">"
    patience: 10
