env:
  name: "LevelDrop"
  map_name: "DropOperations" # User provided map
  env_class: "LevelDropEnv"  # New Class
  grid_size: 128
  unit_type: "MARINE"
  enemy_type: "ZERGLING" # Dummy, map defines enemies
  max_steps: 1000

training:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  ent_coef: 0.01
  training_steps: 1000000
  num_envs: 1 # Map based envs often safer with 1 process first

model:
  policy: "CnnPolicy"
  ent_coef: 0.01
  gamma: 0.99
  n_epochs: 10
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3

rewards:
  load_reward: 0.5
  unload_reward: 2.0
  damage_reward: 0.1
  kill_reward: 10.0
  win_reward: 50.0
  loss_penalty: -10.0
  step_penalty: -0.01

active_layers:
  - "allied_unit_density"
  - "enemy_unit_density"
  - "terrain_pathable"
  - "terrain_creep"
  - "allied_health"
  - "enemy_health"
  - "command_assignment"
  - "command_objective"
  - "transport_slots"
  - "passenger_density"

action_heads:
  - "move"
  - "attack"
  - "load"
  - "unload"
