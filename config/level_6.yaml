# config/level_3.yaml
# Configuration for Level 6: Multi-Zergling Control

training:
  training_steps: 150_000
  num_envs: 1
  n_steps: 2048
  batch_size: 512
  learning_rate: 0.0003
  render_beacon: True

# Environment parameters
env:
  env_class: "Level3Env"
  targets: 8
  grid_size: 128
  headless: True
  max_steps: 1200
  maps_dir: "train/maps/level_6"
  rewards:
    success: 50.0
    step_penalty: -0.1
    distance_multiplier: 0.5

# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_kwargs:
      features_dim: 512
  gamma: 0.995
  ent_coef: 0.01
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 400.0 # Adjusted for potentially longer episodes
    comparison: "<"
    patience: 5