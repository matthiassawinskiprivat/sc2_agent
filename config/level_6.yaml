# config/level_6.yaml
# Configuration for Level 6: 8 Zerglings

training:
  training_steps: 2_000_000
  num_envs: 6
  n_steps: 2048
  batch_size: 1024
  learning_rate: 0.0003
  render_beacon: True

# Environment parameters
env:
  env_class: "Level3Env"
  targets: 8
  grid_size: 128
  headless: True
  max_steps: 1200
  maps_dir: "train/maps/level_6"
  guidance_curriculum: False
  rewards:
    success: 90.0
    step_penalty: -0.1
    distance_multiplier: 0.1

# Model parameters
model:
  algorithm: "MaskableRecurrentPPO"
  policy: "CnnLstmPolicy"
  rnn_type: "gru"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    lstm_hidden_size: 512
    net_arch: []
  gamma: 0.99
  ent_coef: 0.001
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 1.0 # Adjusted for 8 units (15 steps per unit)
    comparison: "<"
    patience: 5
