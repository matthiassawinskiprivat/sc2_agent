# config/level_0.yaml
# Configuration for the first level of training.

training:
  training_steps: 1_000_000
  num_envs: 4
  n_steps: 1024
  batch_size: 128
  learning_rate: 0.0005
  render_beacon: True

# Environment parameters
env:
  grid_size: 32
  headless: True
  max_steps: 300
  maps_dir: "train/maps/level_0"

# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_kwargs:
      features_dim: 512
  gamma: 0.99
  ent_coef: 0.01
  n_epochs: 3

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 150.0
    comparison: "<"
    patience: 5
