# config/level_0.yaml
# Configuration for the first level of training.

training:
  training_steps: 3_000_000
  num_envs: 6
  n_steps: 2048
  batch_size: 1024
  learning_rate: 0.0003
  render_beacon: True
  watchdog_timeout: 3600

# Environment parameters
env:
  grid_size: 32
  headless: True
  max_steps: 300
  larger_units: False
  maps_dir: "train/maps/level_0"
  guidance_curriculum: False
  rewards:
    success: 50.0
    step_penalty: -0.1
    distance_multiplier: 0.1
  active_layers:
    - "allied_unit_density"
    - "enemy_unit_density"
    - "terrain_pathable"
    - "command_objective"
    - "command_assignment"
  action_heads:
    - "move"

# Model parameters
model:
  policy: "CnnPolicy"
  policy_kwargs:
    features_extractor_class: "src.agent.models.unit_control_network.UnitControlNetwork"
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
  gamma: 0.99
  ent_coef: 0.001
  n_epochs: 4

# Evaluation parameters
evaluation:
  stop_on_metric:
    monitor: "rollout/ep_len_mean"
    threshold: 10.0
    comparison: "<"
    patience: 5
