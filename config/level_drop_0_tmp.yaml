env:
  action_heads:
  - load
  - unload
  active_layers:
  - transport_slots
  - passenger_density
  grid_size: 128
  max_steps: 1000
  name: LevelDrop
  rewards:
    damage_reward: 0.1
    kill_reward: 10.0
    load_reward: 0.5
    loss_penalty: -10.0
    step_penalty: -0.01
    unload_reward: 2.0
    win_reward: 50.0
model:
  ent_coef: 0.01
  gamma: 0.99
  n_epochs: 10
  policy: CnnPolicy
  policy_kwargs:
    features_extractor_class: src.agent.models.unit_control_network.UnitControlNetwork
    features_extractor_kwargs:
      features_dim: 512
      thinking_steps: 3
    net_arch: []
training:
  batch_size: 64
  ent_coef: 0.01
  gamma: 0.99
  learning_rate: 0.0003
  n_epochs: 10
  n_steps: 2048
  num_envs: 1
  training_steps: 100
