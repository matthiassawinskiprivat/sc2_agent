env:
  active_layers: []
  env_class: CaptureTheFlagEnv
  flag_distance_min: 20.0
  grid_size: 128
  headless: true
  maps_dir: train/maps/level_3
  max_steps: 1500
  mineral_budget: 3000
  rewards:
    win_reward: 20.0
    loss_penalty: -20.0
    draw_penalty: -10.0
    pylon_damage_reward: 2
    pylon_damage_penalty: 2
    damage_reward: 0.2
    damage_penalty: 0.2
    distance_multiplier: 0.5
    step_penalty: -0.01
  unit_pool:
  - BANSHEE
  - LIBERATOR
  - VOIDRAY
  - MUTALISK
  - CORRUPTOR
  - TEMPEST
  - TEMPEST
  - MOTHERSHIP
  - CARRIER
  - BROODLORD
  vespene_budget: 3000
evaluation:
  stop_on_metric:
    comparison: '>'
    monitor: rollout/ep_rew_mean
    patience: 10
    threshold: 1000.0
model:
  ent_coef: 0.05
  gamma: 0.995
  n_epochs: 4
  policy: CnnPolicy
  policy_kwargs:
    features_extractor_kwargs:
      features_dim: 512
training:
  batch_size: 512
  learning_rate: 0.0003
  n_steps: 2048
  num_envs: 1
  training_steps: 128
